[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ttl-barcoder"
version = "0.3.0"
authors = [
    { name = "Lars B. Rollik", email = "L.B.Rollik@protonmail.com" }
]
description = "Modular barcode generation for TTL synchronization with clean hardware separation"
readme = "README.md"
keywords = [
    "ttl", "barcode", "synchronization", "daq",
    "bpod", "pigpio", "gpio", "raspberry-pi", "neuroscience",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
bpod = ["pybpodapi"]
pigpio = ["pigpio>=1.78"]
dev = [
    "black",
    "bump2version",
    "pytest-cov",
    "pre-commit",
    "toml",
    "types-PyYAML",
    "mkdocs-material",
]

[project.urls]
Source = "https://github.com/larsrollik/ttl-barcoder"
Issues = "https://github.com/larsrollik/ttl-barcoder/issues"
#Documentation =

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.package-data]
"*" = ["*.config"]

[tool.pytest.ini_options]
addopts = "--cov=rpi_camera_ensemble --cov-report=term-missing --maxfail=5"

[tool.ruff]
line-length = 99
indent-width = 4
include = ["*.pyi"]
extend-exclude = ["*.eggs", "*.git", "*.hg", "*.mypy_cache", "*.tox", "*.venv", "*_build", "*buck-out", "*build", "*dist"]

[tool.ruff.lint]
select = [
    "E",   # Pyflakes (general errors)
    "W",   # Pycodestyle warnings
    "F",   # Pyflakes checks (includes unused imports)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (Python syntax upgrades)
    "YTT", # check for YAML issues
    "SIM", # detect unnecessary comprehensions, loops, etc.
    "PTH", # checks for pathlib best practices
    "TCH", # checks for typing best practices
    "PYI", # checks for pyi files
]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # Accepts: "google", "numpy", or "pep257".

[tool.ruff.lint.per-file-ignores]
".bumpversion.cfg" = ["E501", "W291", "W292"]  # Equivalent to excluding it from whitespace checks

[tool.mypy]
#packages = ["rpi_camera_ensemble"] # TODO: doesn't work. how to exclude my pre-study files ?
#exclude = "tests/*"
# strict = true
# follow_imports = "silent"
warn_return_any = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requests.*", "yaml.*", "pigpio.*", "RPi.*", "picamera2.*"]
ignore_missing_imports = true
