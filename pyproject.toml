[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ttl-barcoder"
dynamic = ["version"]
authors = [
    { name = "Lars B. Rollik", email = "lars@rollik.me" }
]
description = "Modular barcode generation for TTL synchronization with clean hardware separation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "ttl", "barcode", "synchronization", "daq",
    "bpod", "pigpio", "gpio", "raspberry-pi", "neuroscience",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    "numpy>=1.20",
    "pydantic>=2.0",
]

[project.optional-dependencies]
bpod = ["pybpod-api"]
pigpio = ["pigpio>=1.78"]
lgpio = ["lgpio"]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "ruff",
    "mypy",
    "commitizen",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.urls]
Homepage = "https://github.com/murineshiftwork/ttl-barcoder"
Documentation = "https://murineshiftwork.github.io/ttl-barcoder/"
"Issue Tracker" = "https://github.com/murineshiftwork/ttl-barcoder/issues"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"
fallback-version = "0.3.0"

[tool.hatch.build.targets.wheel]
packages = ["src/ttl_barcoder"]

[tool.hatch.build.targets.sdist]
include = ["/src/ttl_barcoder", "/tests", "/examples", "/README.md", "/LICENSE", "/pyproject.toml", "/CITATION.cff", "/VERSION"]

# ---------------------------------------------------------------------------
# Commitizen
# ---------------------------------------------------------------------------
# Release flow:
#   cz bump → updates [tool.commitizen] version + VERSION file,
#             creates "bump: ..." commit and annotated tag v{version}
#   git push && git push --tags → triggers release CI

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "commitizen"
version = "0.4.3"
tag_format = "v$version"
update_changelog_on_bump = false
version_files = ["VERSION"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ttl_barcoder --cov-report=term-missing --maxfail=5"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
indent-width = 4
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PTH", "TCH", "PYI", "YTT", "N"]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
mypy_path = "src"
warn_return_any = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pigpio.*", "lgpio.*", "pybpodapi.*", "pybpod.*"]
ignore_missing_imports = true
