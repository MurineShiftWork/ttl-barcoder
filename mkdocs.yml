site_name: ttl-barcoder
site_description: TTL barcode generation for multi-system DAQ synchronization
site_url: https://murineshiftwork.github.io/ttl-barcoder/
repo_url: https://github.com/murineshiftwork/ttl-barcoder
repo_name: ttl-barcoder
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            show_submodules: false

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Configuration: configuration.md
  - Hardware: hardware.md
  - API Reference: api.md
